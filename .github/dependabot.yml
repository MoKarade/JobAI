# Mises à jour de dépendances proposées automatiquement (porte sécurité de l'Atelier, S6).
# Groupées pour limiter le bruit : une PR par semaine pour les versions mineures/correctives.
# Chaque PR passe par la CI complète (gate, qualité, sécurité) et fusionne seule si tout est vert.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
    ignore:
      # @types/node suit la MAJEURE de Node déclarée (.nvmrc) : une majeure plus récente se change AVEC Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
