name: CI

# Le développement se fait directement sur `main` (décision Marc, 2026-07-28) : il n'y a
# donc pas de revue de PR pour rattraper une erreur. La CI est le SEUL filet partagé —
# elle doit rester rapide et refléter exactement le gate local du CLAUDE.md :
#   npm run typecheck && npm run test && npm run build && npm run lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule exécution utile par référence : un push qui en suit un autre annule le premier.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 1 min 41 s observe.
    timeout-minutes: 15
    name: Gate (typecheck · tests · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push` ni d'appel `gh`, donc aucun n'a besoin du jeton persisté.
          persist-credentials: false

      # La convention de compte-rendu est une COPIE synchronisée de
      # claude-config/conventions/COMPTE-RENDU.md — un CLAUDE.md ne charge rien hors de son
      # arbre, donc le renvoi seul ne chargerait rien. Une copie sans contrôle redevient une
      # variante locale en silence : c'est le mode de panne que ce pas rend bruyant.
      # Pour la faire évoluer : modifier la SOURCE, propager, mettre à jour cette empreinte.
      - name: La convention de compte-rendu n'a pas dérivé
        run: echo "97e36acba8770c9614b6295773267b9690d07bc5bcd130b3bc0d03da996ab62b  docs/COMPTE-RENDU.md" | sha256sum -c -

      - uses: actions/setup-node@v7
        with:
          # Aligné sur les autres dépôts de l'écosystème (.nvmrc fait foi).
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` et non `npm install` : le lockfile est committé et fait autorité.
      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      # Le build vient en dernier : c'est l'étape la plus lente, et un échec de typecheck
      # ou de test la rend inutile.
      - name: Build
        run: npm run build


# ── Où sont passés les garde-fous n°1 et n°5 ? ────────────────────────────────
# Ce fichier portait deux `git grep` en bash — un filet grossier annoncé comme provisoire,
# « en attendant le vrai test-garde `pii-guard` [V1-10] ». Ce test existe désormais
# (`tests/piiGuard.test.ts`) : il tourne dans le job `gate` ci-dessus, avec la même autorité
# de blocage, mais il est PRÉCIS (motifs de forme), son VOLUME est prouvé, sa DISCRIMINATION
# est prouvée motif par motif, et il connaît la convention « un exemple porte un marqueur ».
#
# Les deux versions ont été retirées plutôt que corrigées, parce que maintenir la même règle
# dans deux langages la fait diverger — et elle AVAIT divergé, en silence :
#   · le grep d'adresse attrapait la chaîne fabriquée qui prouve que le test détecte
#     quelque chose (« détecter le détecteur ») ⇒ CI rouge sur quatre commits d'affilée ;
#   · le grep de secrets, masqué derrière le premier, aurait échoué sur la ligne de
#     documentation `DATABASE_URL='postgres://…'` de `scripts/charger-seed.ts` — il n'avait
#     aucune notion d'exemple documenté.
# Une règle, un endroit. Toute évolution du garde-fou n°1 ou n°5 passe par ce test.

  # ---------------------------------------------------------------------------------------
  # Portes qualité de l'Atelier (S6, 23/09/2026) — même dispositif que le pilote BatchChef.
  # Depuis la fusion automatique, une PR verte part en production sans relecture humaine :
  # ces deux jobs sont ce qui garantit qu'elle ne fait RECULER ni la qualité ni la sécurité.
  # Cliquet : qualite/seuils.json fige l'état au jour de la mise en place ; rien ne recule.
  qualite:
    timeout-minutes: 20
    name: Qualité (lint · couverture · code mort · architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dépendances
        run: npm ci --ignore-scripts
      - name: Portes qualité (cliquet)
        run: node qualite/portes.mjs
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-qualite
          path: qualite/rapport.json
          if-no-files-found: ignore

  securite:
    # Secrets dans tout l'historique qui serait fusionné — main + la PR, via HEAD (gitleaks) — + analyse
    # statique du code (Semgrep). Les autres branches relèvent de l'audit, pas de la porte : sans
    # --log-opts, gitleaks lirait `--all` et une vieille branche ferait rougir une PR qui n'y touche pas.
    # Mesuré le 23/09/2026 : gitleaks 1 résultat(s) sur l'historique (389 commits), tous des FAUX secrets de fixtures de test (vérifiés un par un), listés dans .gitleaksignore ;
    # Semgrep 0 résultat sur le code (.github exclu). Donc bloquant d'emblée (--error).
    timeout-minutes: 10
    name: Sécurité (secrets · analyse statique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks lit l'historique complet, pas seulement le dernier commit
          persist-credentials: false
      # Binaire officiel, version et empreinte figées : un outil de sécurité téléchargé sans
      # vérification serait lui-même une surface d'attaque.
      - name: Secrets (gitleaks, historique complet)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --log-opts="--full-history HEAD" --gitleaks-ignore-path .gitleaksignore
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Analyse statique (Semgrep)
        run: |
          # --only-binary : aucune compilation ni script d'installation, seulement des roues publiées.
          python -m pip install --quiet --only-binary :all: semgrep==1.177.0
          semgrep scan --metrics off --error --exclude .github \
            --config p/typescript --config p/react --config p/nextjs \
            --config p/secrets --config p/owasp-top-ten .
