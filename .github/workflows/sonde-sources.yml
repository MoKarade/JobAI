# Sonde des sources d'offres — à la demande, lecture seule.
#
# La session de développement n'a aucun accès sortant : les analyseurs d'ingestion y sont
# testés sur des formats documentés, jamais sur une vraie réponse. Ce workflow tourne là où
# le réseau est ouvert et confronte le code au réel.
#
# Il n'a AUCUN secret et n'écrit nulle part : ni base, ni dépôt. On peut donc le relancer
# autant qu'on veut, et il ne peut rien abîmer.

name: Sonde des sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonder:
    name: Interroger les sources et rapporter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sonder les sources actuelles
        run: npx tsx scripts/sonder-sources.ts

      - name: Sonder les sources québécoises
        run: npx tsx scripts/sonder-quebec.ts

      # Ajoutée le 2026-08-05 : « ça fait plusieurs jours y'a pas assez d'offres ». Les
      # sources actives ne produisent rien ; celle-ci cherche celles qui répondent
      # VRAIMENT, à commencer par les données ouvertes du Canada — nommément autorisées
      # par le garde-fou n°4.
      - name: Sonder les sources ouvertes (données ouvertes, API publiques)
        run: npx tsx scripts/sonder-ouvert.ts

      # Ajoutée le 2026-08-05 : « quand tu ne trouves pas l'adresse exacte je veux une
      # recherche web ou maps pour trouver ». Web et Maps sont hors d'atteinte (clé
      # payante ou moissonnage interdit) ; cette sonde mesure les deux sources GRATUITES
      # et OFFICIELLES qui restent — Overpass par nom, et le registre des entreprises.
      - name: Sonder les sources d'ADRESSE (Overpass par nom, registre du Québec)
        run: npx tsx scripts/sonder-adresses.ts
